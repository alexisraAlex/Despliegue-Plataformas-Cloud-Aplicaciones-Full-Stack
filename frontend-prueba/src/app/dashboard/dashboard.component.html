<div class="dashboard-wrapper">
  <header style="display: flex; justify-content: space-between; padding: 20px; background: #222; color: #fff;">
    <h1>Panel de Control</h1>
    <button (click)="onLogout()" style="background: red; color: white; border: none; padding: 10px 20px; cursor: pointer;">Cerrar Sesión</button>
  </header>

  <main style="padding: 20px;">
    <h3>Usuarios en la Base de Datos (Seguridad JWT)</h3>
    <table border="1" style="width: 100%; text-align: left; border-collapse: collapse; margin-top: 20px;">
      <thead>
        <tr style="background: #eee;">
          <th style="padding: 10px;">ID</th>
          <th style="padding: 10px;">Nombre</th>
          <th style="padding: 10px;">Email</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of listaUsuarios">
          <td style="padding: 10px;">{{ item.id || item._id }}</td>
          <td style="padding: 10px;">{{ item.nombre }}</td>
          <td style="padding: 10px;">{{ item.email }}</td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
