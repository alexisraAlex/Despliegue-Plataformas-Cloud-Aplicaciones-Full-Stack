<div class="dashboard-wrapper">
  <header style="display: flex; justify-content: space-between; padding: 20px; background: #222; color: #fff; align-items: center;">
    <h1 style="margin: 0; font-size: 1.5rem;">Panel de Control</h1>
    <button (click)="onLogout()" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">Cerrar Sesión</button>
  </header>

  <main style="padding: 20px;">
    <h2>Usuarios en la Base de Datos</h2>

    <div *ngIf="cargando" style="margin: 20px 0; font-weight: bold;">
      Cargando información...
    </div>

    <table *ngIf="!cargando" border="1" style="width: 100%; text-align: left; border-collapse: collapse; margin-top: 20px;">
      <thead>
        <tr style="background: #f4f4f4;">
          <th style="padding: 12px;">ID</th>
          <th style="padding: 12px;">Nombre</th>
          <th style="padding: 12px;">Email</th>
          <th style="padding: 12px;">Rol</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of listaUsuarios">
          <td style="padding: 10px;">{{ item._id || item.id || 'N/A' }}</td>
          <td style="padding: 10px;">{{ item.nombre || item.name || 'Sin nombre' }}</td>
          <td style="padding: 10px;">{{ item.email || 'Sin email' }}</td>
          <td style="padding: 10px;">{{ item.rol || item.role || 'user' }}</td>
        </tr>
        <tr *ngIf="listaUsuarios.length === 0">
          <td colspan="4" style="padding: 15px; text-align: center;">No se encontraron usuarios registrados.</td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
